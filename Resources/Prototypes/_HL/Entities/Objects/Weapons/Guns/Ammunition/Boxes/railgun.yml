- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard]
  id: BaseAmmoBox15mmSabot
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge15mmSabot
    proto: Cartridge15mmSabot
    capacity: 15
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _HL/Objects/Weapons/Guns/Ammunition/Boxes/15mm_sabot.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseAmmoBox15mmSabot
  id: AmmoBox15mmSabot
  name: ammunition box (15mm Sabot)
  components:
  - type: BallisticAmmoProvider
    capacity: 15
    proto: Cartridge15mmSabot
  - type: Sprite
    sprite: _HL/Objects/Weapons/Guns/Ammunition/Boxes/15mm_sabot.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance
